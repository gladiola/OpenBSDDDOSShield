# =============================================================================
# /etc/relayd.conf — OpenBSD DDoS Shield (relayd relay daemon)
# =============================================================================
#
# relayd acts as a reverse proxy / HTTP accelerator in front of your web
# server.  Combined with the pf.conf in this repository it provides:
#   - SYN-proxy and per-IP connection limits (pf layer)
#   - Short idle timeouts to reclaim resources from slow/stalled connections
#   - X-Forwarded-For header injection so the backend sees real client IPs
#   - Removal of information-leaking response headers (Server, X-Powered-By)
#   - HTTP/1.1 keep-alive limiting to prevent Slowloris-style attacks
#   - Backend health checks so relayd stops forwarding to a downed server
#
# Reload with:   relayctl reload
# Check status:  relayctl show summary
#
# Adjust the macros in the "VARIABLES" section before loading.
# =============================================================================

# -----------------------------------------------------------------------------
# VARIABLES — edit these to match your environment
# -----------------------------------------------------------------------------

# IP and port that relayd will listen on for incoming HTTP traffic.
# Set to your public IP (or 0.0.0.0 to listen on all interfaces).
relay_http_addr = "0.0.0.0"
relay_http_port = 80

# IP and port that relayd will listen on for HTTPS.
# TLS termination requires a certificate; see the README for details.
relay_https_addr = "0.0.0.0"
relay_https_port = 443

# The real web server (backend) that relayd forwards requests to.
# Typically 127.0.0.1 when the web server runs on the same machine.
backend_ip   = "127.0.0.1"
backend_http_port  = 8080
backend_https_port = 8443

# Maximum seconds to wait for a client to send a complete request and for
# the backend to respond.  Keep these short to defeat Slowloris attacks.
client_timeout  = 30   # seconds
backend_timeout = 30   # seconds

# Maximum simultaneous sessions handled by this relay instance.
max_sessions = 1000

# -----------------------------------------------------------------------------
# BACKEND HOST POOLS
# relayd performs health checks and stops forwarding to unreachable backends.
# Add more IPs (one per line, comma-separated) for load-balanced setups.
# -----------------------------------------------------------------------------
table <webhosts_http>  { $backend_ip }
table <webhosts_https> { $backend_ip }

# -----------------------------------------------------------------------------
# HTTP PROTOCOL — defines how relayd handles HTTP-layer details
# -----------------------------------------------------------------------------
http protocol "http_filter" {

    # -------------------------------------------------------------------------
    # Client-to-backend (request) header manipulation
    # -------------------------------------------------------------------------

    # Inject the real client IP so the backend can log it and apply per-IP
    # throttling (e.g. in application-level rate limiters).
    match request header append "X-Forwarded-For"  value "$REMOTE_ADDR"
    match request header append "X-Real-IP"        value "$REMOTE_ADDR"

    # Tell the backend that the original protocol was HTTP.
    match request header set    "X-Forwarded-Proto" value "http"

    # Limit the number of requests on a single keep-alive connection.
    # This caps the damage any one connection can do and helps against
    # Slowloris-style keep-alive floods.
    match request header set "Connection" value "close"

    # -------------------------------------------------------------------------
    # Backend-to-client (response) header manipulation
    # -------------------------------------------------------------------------

    # Remove headers that reveal internal server technology, reducing the
    # information available to attackers for targeted exploits.
    match response header remove "Server"
    match response header remove "X-Powered-By"
    match response header remove "X-AspNet-Version"

    # Enforce sensible security headers so browsers provide an extra layer of
    # protection for visitors.
    match response header set "X-Content-Type-Options" value "nosniff"
    match response header set "X-Frame-Options"        value "SAMEORIGIN"

    # -------------------------------------------------------------------------
    # TCP tuning
    # -------------------------------------------------------------------------
    tcp { nodelay, sack, backlog 128 }
}

# HTTPS uses the same filter rules; add "tls" options below when enabling TLS.
http protocol "https_filter" {
    match request header append "X-Forwarded-For"   value "$REMOTE_ADDR"
    match request header append "X-Real-IP"         value "$REMOTE_ADDR"
    match request header set    "X-Forwarded-Proto" value "https"
    match request header set    "Connection"        value "close"

    match response header remove "Server"
    match response header remove "X-Powered-By"
    match response header remove "X-AspNet-Version"
    match response header set "X-Content-Type-Options" value "nosniff"
    match response header set "X-Frame-Options"        value "SAMEORIGIN"
    match response header set "Strict-Transport-Security" \
        value "max-age=31536000; includeSubDomains"

    tcp { nodelay, sack, backlog 128 }
}

# -----------------------------------------------------------------------------
# RELAYS
# Each relay block binds to a listen address, applies a protocol, and
# forwards accepted connections to the backend pool.
# -----------------------------------------------------------------------------

relay "http_relay" {
    # Where relayd accepts incoming HTTP connections from the internet
    listen on $relay_http_addr port $relay_http_port

    # Apply the DDoS-aware HTTP filter defined above
    protocol "http_filter"

    # Forward to the backend web server; perform HTTP health checks every
    # 10 seconds — if the backend returns anything other than HTTP 200 on "/"
    # relayd stops sending traffic to that backend.
    forward to <webhosts_http> port $backend_http_port \
        check http "/" code 200 \
        timeout $backend_timeout

    # Cap total simultaneous sessions for this relay (supplements pf limits)
    session timeout $client_timeout
}

# Uncomment and configure TLS certificates to enable HTTPS termination.
# Place the certificate at /etc/ssl/relayd/ (see relayd.conf(5) for details).
