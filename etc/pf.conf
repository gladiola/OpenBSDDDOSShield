# =============================================================================
# /etc/pf.conf — OpenBSD DDoS Shield (Packet Filter rules)
# =============================================================================
#
# This ruleset protects a web server behind relayd from DDoS and brute-force
# attacks.  Deploy with:
#   pfctl -f /etc/pf.conf
#
# Adjust the macros in the "VARIABLES" section to match your environment
# before loading.
# =============================================================================

# -----------------------------------------------------------------------------
# VARIABLES — edit these to match your environment
# -----------------------------------------------------------------------------
ext_if      = "em0"         # External-facing network interface
relay_http  = "80"          # Port relayd listens on for plain HTTP
relay_https = "443"         # Port relayd listens on for HTTPS

# Limits per source IP (tune to taste)
max_http_conn      = "200"  # Max simultaneous HTTP connections per source
max_http_conn_rate = "50/5" # Max new HTTP connections per 5-second window
max_ssh_conn       = "5"    # Max simultaneous SSH connections per source
max_ssh_rate       = "5/60" # Max new SSH connections per 60-second window
max_icmp_rate      = "5/10" # Max ICMP echo requests per 10-second window

# -----------------------------------------------------------------------------
# PERSISTENT TABLES — survive reloads; edit files to pre-populate them
# -----------------------------------------------------------------------------

# Addresses that are always allowed through (your own IPs, trusted partners)
table <whitelist> persist file "/etc/pf.whitelist"

# Auto-populated by the overload rules below; also usable for manual bans
table <ddos_block> persist file "/etc/pf.ddos_block"

# -----------------------------------------------------------------------------
# GLOBAL OPTIONS
# -----------------------------------------------------------------------------
set block-policy drop        # Silently drop blocked packets (no RST/ICMP)
set loginterface $ext_if     # Count bytes on the external interface
set optimization aggressive  # Aggressively expire state for flooded hosts
set skip on lo0              # Never filter loopback traffic

# -----------------------------------------------------------------------------
# TRAFFIC NORMALISATION (scrub)
# Reassembles fragments, removes DF bit, randomises IP IDs, and clamps MSS.
# Helps defeat several fragmentation- and fingerprinting-based attacks.
# -----------------------------------------------------------------------------
match in  all scrub (no-df random-id max-mss 1440)
match out all scrub (no-df random-id max-mss 1440)

# -----------------------------------------------------------------------------
# DEFAULT POLICY — block everything; rules below open only what is needed
# -----------------------------------------------------------------------------
block drop log all

# -----------------------------------------------------------------------------
# LOOPBACK — always permit (relayd and the backend web server both live here)
# -----------------------------------------------------------------------------
pass quick on lo0 all

# -----------------------------------------------------------------------------
# ANTI-SPOOFING — drop packets whose source cannot arrive via $ext_if
# -----------------------------------------------------------------------------
antispoof quick log for $ext_if

# -----------------------------------------------------------------------------
# WHITELIST — always pass before any block or rate-limit rule
# -----------------------------------------------------------------------------
pass quick from <whitelist>

# -----------------------------------------------------------------------------
# BLOCKLIST — drop all traffic from auto-banned or manually listed addresses
# -----------------------------------------------------------------------------
block drop log quick from <ddos_block>

# -----------------------------------------------------------------------------
# OUTBOUND — let the server initiate connections (software updates, etc.)
# -----------------------------------------------------------------------------
pass out quick on $ext_if all modulate state

# -----------------------------------------------------------------------------
# ICMP — allow ping but rate-limit to prevent flood abuse
# Hosts that exceed max_icmp_rate are moved to <ddos_block>.
# -----------------------------------------------------------------------------
pass in on $ext_if inet proto icmp icmp-type echoreq \
    keep state \
    (max-src-conn-rate $max_icmp_rate, \
     overload <ddos_block> flush global)

# -----------------------------------------------------------------------------
# SSH — rate-limit to defeat both brute-force and connection floods
# -----------------------------------------------------------------------------
pass in on $ext_if proto tcp to port 22 \
    keep state \
    (max-src-conn $max_ssh_conn, \
     max-src-conn-rate $max_ssh_rate, \
     overload <ddos_block> flush global)

# -----------------------------------------------------------------------------
# HTTP / HTTPS via relayd — core DDoS mitigation for web traffic
#
# "synproxy state" makes PF complete the TCP handshake on behalf of relayd
# before forwarding the connection, defeating SYN-flood attacks.
#
# "max-src-conn" and "max-src-conn-rate" cap per-IP concurrency and burst
# rates; violators are auto-added to <ddos_block> and all their existing
# connections flushed.
# -----------------------------------------------------------------------------
pass in on $ext_if proto tcp to port { $relay_http $relay_https } \
    synproxy state \
    (max-src-conn $max_http_conn, \
     max-src-conn-rate $max_http_conn_rate, \
     overload <ddos_block> flush global)

# -----------------------------------------------------------------------------
# MAINTENANCE — periodically flush expired entries from <ddos_block>
# Add to cron (runs as root):
#   */15 * * * * /sbin/pfctl -t ddos_block -T expire 3600
# This removes IPs that have been blocked for more than one hour.
# -----------------------------------------------------------------------------
